<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Placed – Gujjuben's Khakhra</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #fff8f0;
      font-family: "Segoe UI", sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(229,57,53,0.10);
      padding: 56px 48px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: pop 0.45s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes pop { from { opacity:0; transform:scale(0.85); } to { opacity:1; transform:scale(1); } }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h2 { font-size: 24px; color: #2d1a00; margin-bottom: 8px; }
    p  { font-size: 14px; color: #7a5c2e; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: linear-gradient(135deg, #e53935, #ff7043);
      color: #fff;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
  </style>
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h2>Order Placed!</h2>
    <p>Thank you for your order. We'll get your Khakhra packed and on its way soon.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
  <script src="js/toast.js"></script>
</body>
</html>
