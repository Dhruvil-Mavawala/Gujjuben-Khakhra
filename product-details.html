<!DOCTYPE html>
<html lang="en">
  <head>
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/design-system.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - Gujjuben's Khakhra</title>
<link rel="stylesheet" href="css/product-details.css" />
<link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="page-wrapper">

      <!-- Navbar -->
      <div class="frame-5471">
        <div class="nav-bar">
          <img class="union" src="assets/images/union0.svg" alt="Logo" />
          <div class="frame-5470">
            <div class="features-tab">
              <div onclick="location.href='/'">Home</div>
              <div onclick="location.href='/about'">About us</div>
              <div onclick="location.href='/productlist'">Our Products</div>
              <div>Deal with us</div>
            </div>
            <div class="cart-button" onclick="location.href='/cart'" style="cursor:pointer">
              <div class="component-2-primary-button">
                <img class="mdi-cart-outline" src="assets/images/mdi-cart-outline0.svg" />
                <span id="cart-count" class="cart-count">0</span>
              </div>
            </div>
            <button type="button" class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
          </div>
        </div>
      </div>

      <!-- Product detail section -->
      <div class="detail-section" id="detail-section">
        <div class="detail-img-wrap">
          <img id="detail-img" class="detail-img" src="" alt="" />
        </div>
        <div class="detail-info">
          <div id="detail-name"  class="detail-name">Loading...</div>
          <div id="detail-price" class="detail-price"></div>
          <div id="detail-desc"  class="detail-desc"></div>
          <div class="detail-action" id="detail-action">
            <button class="detail-add-btn" id="detail-add-btn">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Reviews section -->
      <div class="reviews-section" id="reviews-section">

        <div class="reviews-left">
          <h2 class="reviews-heading">Customer Reviews</h2>

          <!-- Average rating -->
          <div class="rating-summary">
            <div class="rating-avg" id="rating-avg">—</div>
            <div class="rating-stars-avg" id="rating-stars-avg"></div>
            <div class="rating-count" id="rating-count">No reviews yet</div>
          </div>

          <!-- Review list -->
          <div class="review-list" id="review-list">
            <div class="review-empty">Be the first to review this product.</div>
          </div>
        </div>

        <div class="reviews-right">
          <h3 class="write-heading">Write a Review</h3>
          <form class="review-form" id="review-form" novalidate>

            <div class="form-group">
              <label class="form-label">Your Name</label>
              <input class="form-input" id="review-name" type="text" placeholder="Enter your name" required />
            </div>

            <div class="form-group">
              <label class="form-label">Rating</label>
              <div class="star-picker" id="star-picker">
                <span class="star" data-val="1">★</span>
                <span class="star" data-val="2">★</span>
                <span class="star" data-val="3">★</span>
                <span class="star" data-val="4">★</span>
                <span class="star" data-val="5">★</span>
              </div>
              <input type="hidden" id="review-rating" value="0" />
            </div>

            <div class="form-group">
              <label class="form-label">Review</label>
              <textarea class="form-input form-textarea" id="review-text" placeholder="Share your experience..." required></textarea>
            </div>

            <button type="submit" class="review-submit-btn">Submit Review</button>
            <div class="review-msg" id="review-msg"></div>
          </form>
        </div>

      </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/cart-store.js"></script>
    <script src="js/product-details.js"></script>
    <script src="js/cart-badge.js"></script>
    <script src="js/navbar.js"></script>
  <script src="js/toast.js"></script>
</body>
</html>
