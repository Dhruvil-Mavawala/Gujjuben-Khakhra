# ─────────────────────────────────────────────────────────────────
#  netlify.toml  –  Gujjuben's Khakhra (Static Frontend)
#  Backend runs separately on Render (server.js)
#  This file configures ONLY the Netlify static deployment.
# ─────────────────────────────────────────────────────────────────

[build]
  publish = "."
  # No build command — pure static HTML/CSS/JS

# ── Security Headers ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── Clean URL rewrites (200 = serve file, URL stays clean) ────────

# ── API Proxy → Render backend (avoids browser CORS entirely) ────
[[redirects]]
  from = "/api/*"
  to = "https://gujjuben-khakhra.onrender.com/:splat"
  status = 200
  force = true

