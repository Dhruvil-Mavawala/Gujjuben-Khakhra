<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Gujjuben's Khakhra</title>
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/login.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div class="auth-page">

  <!-- ── LEFT: Branding ── -->
  <div class="auth-brand">
    <img class="brand-bg" src="assets/images/1774656248870_kh2.jpg" alt="Khakhra" />
    <div class="brand-overlay">
      <img class="brand-logo" src="assets/images/union0.svg" alt="Gujjuben's Khakhra" />
      <div class="brand-title">Gujjuben's Khakhra</div>
      <div class="brand-tagline">Authentic Taste of Gujarat — crispy, wholesome, made with love.</div>
      <span class="brand-badge">Since 2020</span>
    </div>
  </div>

  <!-- ── RIGHT: Form ── -->
  <div class="auth-form-panel">
    <div class="auth-card">

      <h2 class="auth-card-title">Welcome 👋</h2>
      <p class="auth-card-sub">Enter your email to sign in or create an account</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon">📧</span>
            <input
              type="email"
              id="login-email"
              placeholder="you@example.com"
              autocomplete="email"
              autofocus
            />
          </div>
          <span class="field-error" id="err-email"></span>
        </div>

        <span class="form-msg" id="err-form"></span>

        <button type="submit" class="auth-btn" id="login-submit">
          Continue with Email
        </button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or</span></div>

      <!-- Google -->
      <button class="google-btn" id="google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

    </div>
  </div>

</div>

<!-- Clerk Browser SDK -->
<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_cHJvYmFibGUtbW9zcXVpdG8tMjMuY2xlcmsuYWNjb3VudHMuZGV2JA"
  src="https://probable-mosquito-23.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
  type="text/javascript"
  onload="window.__clerkScriptLoaded = true;"
  onerror="console.error('❌ Clerk SDK failed to load.');"
></script>
<script src="js/config.js"></script>
<script src="js/clerk-init.js"></script>
<script src="js/session.js"></script>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script src="js/login.js"></script>
<script src="js/toast.js"></script>
</body>
</html>
